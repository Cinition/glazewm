window_rules:
  - commands: ['ignore']
    match:
      # Ignores any Zebar windows.
      - window_process: { equals: 'zebar' }

      # Ignores picture-in-picture windows for browsers.
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # Ignore rules for various 3rd-party apps.
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }
      - window_process: { equals: 'Taskmgr' }

      # Custom rules

  - commands: ['set-floating']
    match:
      - window_title: { equals: 'Calculator' }

  - commands: ['set-floating']
    match:
      - window_title: { equals: 'Search' }
      - window_title: { equals: 'SH00' }
      - window_title: { equals: 'AllProjects' }
      - window_title: { equals: 'V3DesktopClient' }

  - commands: ['move --workspace 11']
    match:
      - window_process: { equals: 'plastic' }

  - commands: ['move --workspace 12']
    match:
      - window_process: { equals: 'FPilot' }

  - commands: ['move --workspace 13']
    match:
      - window_process: { equals: 'Everything' }

  - commands: ['move --workspace 21', 'set-tiling']
    match:
      - window_title: { regex: 'SH00 - .* - Microsoft Visual Studio' }

  - commands: ['move --workspace 23']
    match:
      - window_title: { regex: 'V3\\Bin\\V3Client' }

  - commands: ['move --workspace 23']
    match:
      - window_title: { equals: 'LuaConsole' }

  - commands: ['move --workspace 24']
    match:
      - window_title: { equals: 'Tenstar' }

  - commands: ['move --workspace 25', 'set-tiling']
    match:
      - window_title: { regex: 'V3DesktopClient - .* - Microsoft Visual Studio' }

  - commands: ['move --workspace 26', 'set-tiling']
    match:
      - window_title: { regex: 'AllProjects - .* - Microsoft Visual Studio' }

  - commands: ['move --workspace 31']
    match:
      - window_process: { equals: 'Discord' }

  - commands: ['move --workspace 31']
    match:
      - window_process: { equals: 'vivaldi' }

  - commands: ['move --workspace 32']
    match:
      - window_process: { equals: 'olk' }

  - commands: ['move --workspace 32']
    match:
      - window_process: { equals: 'ms-teams' }

  - commands: ['move --workspace 33']
    match:
      - window_process: { equals: 'Notion' }

  - commands: ['move --workspace 33']
    match:
