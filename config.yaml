  - commands: ['move --workspace 99']
    match:
      - window_process: { equals: 'Spotify' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

  - name: 'left_screen'
    keybindings:
      - commands: ['focus --workspace 11', 'wm-disable-binding-mode --name left_screen']
        bindings: ['alt+1']
      - commands: ['focus --workspace 12', 'wm-disable-binding-mode --name left_screen']
        bindings: ['alt+2']
      - commands: ['focus --workspace 13', 'wm-disable-binding-mode --name left_screen']
        bindings: ['alt+3']
      - commands: ['focus --workspace 10', 'wm-disable-binding-mode --name left_screen']
        bindings: ['alt+0']
      - commands: ['wm-disable-binding-mode --name left_screen']
        bindings: ['escape', 'enter']

  - name: 'center_screen'
    keybindings:
      - commands: ['focus --workspace 21', 'wm-disable-binding-mode --name center_screen']
        bindings: ['alt+1']
      - commands: ['focus --workspace 22', 'wm-disable-binding-mode --name center_screen']
        bindings: ['alt+2']
      - commands: ['focus --workspace 23', 'wm-disable-binding-mode --name center_screen']
        bindings: ['alt+3']
      - commands: ['focus --workspace 24', 'wm-disable-binding-mode --name center_screen']
        bindings: ['alt+4']
      - commands: ['focus --workspace 25', 'wm-disable-binding-mode --name center_screen']
        bindings: ['alt+5']
      - commands: ['focus --workspace 26', 'wm-disable-binding-mode --name center_screen']
        bindings: ['alt+6']
      - commands: ['focus --workspace 20', 'wm-disable-binding-mode --name center_screen']
        bindings: ['alt+0']
      - commands: ['wm-disable-binding-mode --name center_screen']
        bindings: ['escape', 'enter']

  - name: 'right_screen'
    keybindings:
      - commands: ['focus --workspace 31', 'wm-disable-binding-mode --name right_screen']
        bindings: ['alt+1']
      - commands: ['focus --workspace 32', 'wm-disable-binding-mode --name right_screen']
        bindings: ['alt+2']
      - commands: ['focus --workspace 33', 'wm-disable-binding-mode --name right_screen']
        bindings: ['alt+3']
      - commands: ['focus --workspace 30', 'wm-disable-binding-mode --name right_screen']
        bindings: ['alt+0']
      - commands: ['wm-disable-binding-mode --name right_screen']
        bindings: ['escape', 'enter']

keybindings:
  # Spotify keybinding
  - commands: ['focus --workspace 99']
    bindings: ['alt+4']

  # Shift focus in a given direction.
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  # Move focused window in a given direction.
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  # As an alternative to the resize keybindings above, resize mode enables
  # resizing via arrow keys or HJKL. The binding mode is defined above with
  # the name 'resize'.
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']

  - commands: ['wm-enable-binding-mode --name left_screen']
    bindings: ['alt+1']

  - commands: ['wm-enable-binding-mode --name center_screen']
    bindings: ['alt+2']

  - commands: ['wm-enable-binding-mode --name right_screen']
    bindings: ['alt+3']

  # Change tiling direction. This determines where new tiling windows will
  # be inserted.
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']

  # Change focus from tiling windows -> floating -> fullscreen.
  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']

  # Change the focused window to be floating.
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']

  # Change the focused window to be tiling.
  - commands: ['toggle-tiling']
    bindings: ['alt+t']

  # Change the focused window to be fullscreen.
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']

  # Close focused window.
  - commands: ['close']
    bindings: ['alt+q']

  # Kill GlazeWM process safely.
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']

  # Re-evaluate configuration file.
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']

  # Redraw all windows.
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']

  # Launch CMD terminal. Alternatively, use `shell-exec wt` or
  # `shell-exec %ProgramFiles%/Git/git-bash.exe` to start Windows
  # Terminal and Git Bash respectively.
  - commands: ['shell-exec wt']
    bindings: ['alt+enter']

  # Focus the next/previous active workspace defined in `workspaces` config.
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+d']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+a']

  # Focus the workspace that last had focus.
  - commands: ['focus --recent-workspace']
    bindings: ['alt+s']

  # Move focused window to a workspace defined in `workspaces` config.
  - commands: ['move --workspace 10', 'focus --workspace 10']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 20', 'focus --workspace 20']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 30', 'focus --workspace 30']
    bindings: ['alt+shift+3']
